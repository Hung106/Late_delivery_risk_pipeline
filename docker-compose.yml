version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  environment:
    AIRFLOW_UID: 50000

    # Airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__FERNET_KEY: ""

    # Metadata Database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow_db

    # Connection: PostgreSQL OLTP
    AIRFLOW_CONN_OLIST_POSTGRES: postgresql://postgres:postgres@olist_postgres:5432/olist_oltp_db

    # Connection: Databricks
    AIRFLOW_CONN_DATABRICKS_DEFAULT: databricks://:${DATABRICKS_TOKEN}@${DATABRICKS_HOST}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins

    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data

#########################################################
# Services
#########################################################

services:

  #########################################################
  # PostgreSQL - OLTP
  #########################################################

  postgres:
    image: postgres:17
    container_name: olist_postgres
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olist_oltp_db

    volumes:
      - olist_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olist_oltp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #########################################################
  # PostgreSQL - Airflow Metadata
  #########################################################

  airflow_postgres:
    image: postgres:17
    container_name: airflow_postgres
    restart: unless-stopped

    ports:
      - "5434:5432"

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_db

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #########################################################
  # Airflow Init
  #########################################################

  airflow-init:
    <<: *airflow-common

    container_name: airflow_init

    depends_on:
      airflow_postgres:
        condition: service_healthy

    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "

  #########################################################
  # Airflow Scheduler
  #########################################################

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow_scheduler

    command: scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      airflow_postgres:
        condition: service_healthy

  #########################################################
  # Airflow Webserver
  #########################################################

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow_webserver

    command: webserver

    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      airflow_postgres:
        condition: service_healthy

#########################################################
# Volumes
#########################################################

volumes:
  olist_postgres_data:
  airflow_postgres_data: